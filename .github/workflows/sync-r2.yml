name: Sync Images to Cloudflare R2 (Smart Hybrid)

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.JPG'
      - '**/*.jpeg'
      - '**/*.JPEG'
      - '**/*.webp'
      - '**/*.WEBP'
  workflow_dispatch: # Nút bấm thủ công trên GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Smart Sync Images to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          THRESHOLD=500  # Ngưỡng file thay đổi

          # Tối ưu AWS CLI cho Full Sync
          aws configure set default.s3.max_concurrent_requests 30
          aws configure set default.s3.max_queue_size 10000

          # 1. Bắt danh sách file thay đổi bằng Git
          git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > added_files.txt || true
          git diff --name-only --diff-filter=D HEAD~1 HEAD | grep -iE '\.(png|jpg|jpeg|webp)$' > deleted_files.txt || true

          ADDED_COUNT=$(wc -l < added_files.txt)
          DELETED_COUNT=$(wc -l < deleted_files.txt)
          TOTAL_CHANGES=$((ADDED_COUNT + DELETED_COUNT))

          echo "Event Name: ${{ github.event_name }}"
          echo "Detected $ADDED_COUNT added/modified files and $DELETED_COUNT deleted files."

          # 2. KIỂM TRA ĐIỀU KIỆN ĐỒNG BỘ

          # Trường hợp 1: Bấm nút "Run workflow" THỦ CÔNG HOẶC thay đổi quá 500 file -> Bắt buộc FULL SYNC
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$TOTAL_CHANGES" -gt "$THRESHOLD" ]; then
            echo "================================================="
            echo "Triggered via Manual Run or Large Changeset ($TOTAL_CHANGES files)."
            echo "Executing FULL SYNC mode via AWS S3 Sync..."
            echo "================================================="
            
            aws s3 sync . "s3://${R2_BUCKET_NAME}" \
              --endpoint-url "$ENDPOINT" \
              --delete \
              --cache-control "public, max-age=31536000, immutable" \
              --exclude "*" \
              --include "*.png" --include "*.jpg" --include "*.jpeg" --include "*.webp" \
              --include "*.PNG" --include "*.JPG" --include "*.JPEG" --include "*.WEBP"

            echo "HAS_CHANGES=true" >> $GITHUB_ENV

          # Trường hợp 2: Push code tự động với < 500 file -> Chạy Delta Sync siêu tốc
          elif [ "$TOTAL_CHANGES" -gt 0 ]; then
            echo "================================================="
            echo "Small changeset detected ($TOTAL_CHANGES files). Using FAST DELTA SYNC mode..."
            echo "================================================="

            # Upload file thay đổi
            if [ -s added_files.txt ]; then
              export ENDPOINT R2_BUCKET_NAME
              cat added_files.txt | xargs -P 25 -I {} bash -c '
                if [ -f "$1" ]; then
                  echo "Uploading: $1"
                  aws s3 cp "$1" "s3://${R2_BUCKET_NAME}/$1" \
                    --endpoint-url "$ENDPOINT" \
                    --cache-control "public, max-age=31536000, immutable"
                fi
              ' _ {}
            fi

            # Xóa file bị hủy
            if [ -s deleted_files.txt ]; then
              split -l 1000 deleted_files.txt batch_del_
              for batch_file in batch_del_*; do
                jq -n --rawfile lines "$batch_file" '{Objects: ($lines | split("\n") | map(select(length > 0) | {Key: .})), Quiet: true}' > payload.json
                aws s3api delete-objects --bucket "$R2_BUCKET_NAME" --delete file://payload.json --endpoint-url "$ENDPOINT"
                rm -f "$batch_file" payload.json
              done
            fi

            echo "HAS_CHANGES=true" >> $GITHUB_ENV

          else
            echo "No image changes detected in this commit."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          fi

      # 3. TỰ ĐỘNG XÓA CACHE CLOUDFLARE KHI CÓ THAY ĐỔI
      - name: Purge Cloudflare Cache
        if: env.HAS_CHANGES == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "Purging Cloudflare Edge Cache..."
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
